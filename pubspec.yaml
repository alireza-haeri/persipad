name: storypad
version: 2.34.0+834
publish_to: none
environment:
  sdk: ^3.11.0
description: Minimalist application to write stories, notes, diary!

dependencies:
  adaptive_dialog:
    path: packages/adaptive_dialog
  animated_clipper: 0.2.0+2
  animations: 3.0.0
  cached_network_image: 4.0.0
  cloud_firestore: 6.10.0
  connectivity_plus: 7.3.1
  copy_with_extension: 17.1.0
  crypto: 3.0.7
  csv: 8.0.0
  cupertino_icons: 1.0.9
  device_info_plus: 13.2.0
  dismissible_page: 1.0.2
  dynamic_color: 1.8.1
  easy_localization: 3.0.8
  emoji_picker_flutter: ^4.5.4
  file_picker: 13.1.0
  firebase_analytics: 12.6.0
  firebase_core: 4.15.0
  firebase_crashlytics: 5.4.0
  flutter:
    sdk: flutter
  flutter_custom_tabs: 2.6.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: 1.0.12
  flutter_secure_storage: 11.2.0
  flutter_slidable: 4.0.3
  flutter_staggered_grid_view: 0.7.0
  flutter_svg: 2.3.0
  fuzzy: 0.5.2
  googleapis: 17.0.0
  html_character_entities: 1.0.0+1
  http: 1.6.0
  image_picker: 1.2.3
  image_picker_android: 0.8.13+23
  image_picker_platform_interface: 2.11.1
  in_app_review: 2.0.12
  in_app_update: 5.0.0
  json_annotation: 4.12.0
  # ^6.15.2 is the first release compatible with the Dart 3.14 SDK we build with on
  # Linux; 6.14.1 conflicts with source_helper and build_runner fails to compile.
  json_serializable: ^6.15.2
  just_audio: 0.10.6
  local_auth: 3.0.2
  flutter_material_design_icons: 3.1.0+7447
  # 5.x does not compile against the Dart 3.14 SDK. Pinned to the 6.0.0 preview
  # until a stable 6.x is out - revisit then (see ai/DECISIONS.md D-009).
  # NOTE: bumping this requires regenerating code: bin/build_runner --delete
  objectbox: 6.0.0-preview.6
  objectbox_flutter_libs: any
  package_info_plus: 10.2.1
  photo_view: 0.15.0
  provider: 6.1.5+1
  quick_actions: 1.1.1
  record: 7.1.1
  share_plus: 13.3.0
  shared_preferences: 2.5.5
  storypad_editor:
    path: packages/storypad_editor
  tar: 2.0.2
  video_player: 2.14.0
  visibility_detector: 0.4.0+2
  yaml: 3.1.4
  flutter_local_notifications: 22.3.1
  timezone: 0.11.1
  flutter_timezone: 5.1.0
  volume_controller: 3.7.0
  video_compressor_plus: 4.1.0

dev_dependencies:
  build_runner: 2.15.1
  copy_with_extension_gen: 17.1.0
  flutter_gen_runner: 5.15.0
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  objectbox_generator: any

flutter:
  uses-material-design: true
  assets:
    - translations/
    - templates/
    - assets/images/
    - assets/images/onboarding/
    - assets/emoji-64/

    - assets/logos/storypad_logo_1_0.icon/Assets/storypad_logo_1_0.png
    - assets/logos/storypad_logo_2_0.icon/Assets/storypad_logo_2_0.png
    - assets/logos/storypad_logo_3_0.icon/Assets/storypad_logo_3_0.png
    - assets/logos/storypad_logo_4_0.icon/Assets/storypad_logo_4_0.png
    - assets/logos/storypad_logo_5_0.icon/Assets/storypad_logo_5_0.png
    - assets/logos/storypad_logo_6_0.icon/Assets/storypad_logo_6_0.png
    - assets/logos/storypad_logo_6_1.icon/Assets/storypad_logo_6_1.png

  # Bundled so Persian/Arabic text renders identically on every OS; English uses
  # the platform system default font with Vazirmatn in kScriptFontFamilyFallback.
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

    # The app's default text family (kDefaultFontFamily). Bundled because
    # `google_fonts` otherwise downloads it over the network on first use, which
    # makes the app's own typography depend on connectivity — see D-043 and
    # ai/ANALYSIS.md §5. One variable font covers 300..700, so it costs ~122 KB
    # instead of four static faces. OFL licence ships next to it.
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Variable.ttf
