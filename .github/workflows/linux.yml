name: Linux

# We ship Linux only (Android is parked — see ai/DECISIONS.md D-007). The agent
# sandbox has no Flutter SDK and no pub.dev access, so compile/test verification has
# to happen here.
#
# SPEED: jobs are opt-in per commit instead of always running everything. A plain
# push runs only `analyze` (~2 min). Ask for more with a marker in the commit
# message:
#
#   [test]   also run the unit tests        (~5 min)
#   [build]  also build the Linux binary    (~4 min)
#   [full]   run all three
#
# Pull requests always run everything. Adding a marker is cheaper than a workflow
# dispatch, which GitHub refuses for workflows that only exist on a feature branch.
#
# Generated code is committed and verified fresh (D-016), so `build_runner` is not
# part of this workflow at all — that alone removed ~75s from every job.

on:
  push:
    branches:
      - 'arena/**'
      - main
      - develop
    paths-ignore:
      - 'ai/**'
      - '**/*.md'
      - 'LICENSE'
      - '.vscode/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        # ADVISORY: the sandbox cannot run `dart format`, so a blocking gate would
        # cost a full round trip per line-break guess. Annotations name every
        # offending file instead (they are the agent's only readable channel —
        # Actions logs come from blob storage, which is blocked).
        continue-on-error: true
        run: |
          find lib test -name "*.dart" -not -name "*.g.dart" -not -name "*.gen.dart" \
            -not -name "*.mocks.dart" -not -path "*/firebase_options/*" -print0 \
            | xargs -0 dart format --line-length=120 > /dev/null

          changed=$(git status --porcelain -- '*.dart' \
            ':!*.g.dart' ':!*.gen.dart' ':!*.mocks.dart' ':!lib/firebase_options/*' \
            | awk '{print $2}')
          if [ -n "$changed" ]; then
            echo "::error::Some Dart files are not formatted (run bin/format):"
            for f in $changed; do
              echo "::error file=$f::Not formatted. Run: bin/format"
            done
            exit 1
          fi
          echo "::notice::All Dart files are formatted"

      - name: flutter analyze
        # Only analyzer *errors* fail this job; infos/warnings are upstream lint
        # debt. Every error is re-emitted as an annotation so it reaches the agent.
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze.txt 2>&1
          status=$?
          cat /tmp/analyze.txt
          if [ $status -ne 0 ]; then
            errors=$(grep -cE '^ *error • ' /tmp/analyze.txt || true)
            echo "::error::flutter analyze found ${errors} error(s)"
            grep -E '^ *error • ' /tmp/analyze.txt | head -10 | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | awk -F' • ' '{print $2}')
              loc=$(printf '%s' "$line" | awk -F' • ' '{print $3}')
              file=${loc%%:*}; rest=${loc#*:}; line_no=${rest%%:*}; col=${rest#*:}
              echo "::error file=${file},line=${line_no},col=${col}::${msg}"
            done
          fi
          exit $status

  test:
    name: Test
    needs: analyze
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit && (contains(github.event.head_commit.message, '[test]') || contains(github.event.head_commit.message, '[full]')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          set +e
          flutter test > /tmp/test.txt 2>&1
          status=$?
          tail -40 /tmp/test.txt
          if [ $status -ne 0 ]; then
            echo "::error::flutter test failed"
            grep -E '^\s*\[E\]|^[0-9:]+ \+[0-9]+ -[0-9]+: Some tests failed' /tmp/test.txt \
              | head -10 | while IFS= read -r line; do
                echo "::error::$line"
              done
          fi
          exit $status

  build-linux:
    name: Build Linux desktop
    needs: analyze
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit && (contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[full]')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        # Keep in sync with bin/setup_linux (ai/ENVIRONMENT.md §2.2).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libpulse-dev \
            liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build (debug)
        # The community flavor is the only one that builds without private keys.
        # Compiler errors are re-emitted as annotations: a bare "exit 1" from a
        # 4 minute build is useless feedback without log access.
        run: |
          set +e
          flutter build linux --debug --target=lib/main_community.dart > /tmp/build.txt 2>&1
          status=$?
          tail -60 /tmp/build.txt
          if [ $status -ne 0 ]; then
            echo "::error::flutter build linux failed"
            grep -E 'lib/.*\.dart:[0-9]+:[0-9]+: Error|^Error: |error •' /tmp/build.txt \
              | head -10 | while IFS= read -r line; do
                echo "::error::$line"
              done
          fi
          exit $status

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: storypad-linux-debug
          path: build/linux/x64/debug/bundle/
          retention-days: 3
          if-no-files-found: warn
