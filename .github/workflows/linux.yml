name: Linux

# We ship Linux only (Android is parked — see ai/DECISIONS.md D-007). This
# workflow is the verifier the agent cannot be: the sandbox has no Flutter SDK
# and no access to pub.dev, so compile/tests/build have to happen here.
#
# Green bar:
#   - "Test" must pass          (unit tests, including the ones covering our changes)
#   - "Build Linux desktop" must pass (the real compile gate for the whole app)
#   - "Analyze" is advisory on purpose: it reports the pre-existing lint debt of
#     the upstream codebase, which is not something a single change should fix.

on:
  push:
    branches:
      - 'arena/**'
      - main
      - develop
  pull_request:
  workflow_dispatch:

# A new push supersedes the previous run: we only care about the latest commit.
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with .tool-versions (D-008). Older SDKs cannot compile this
  # project at all (super_editor uses APIs that only exist in newer Flutter).
  FLUTTER_VERSION: '3.50.0'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        # The repo commits *.g.dart, but pubspec pins a codegen-compatible
        # objectbox/json_serializable pair (D-009) — regenerate before anything
        # reads those files, otherwise the build fails confusingly.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: New tests only (fast signal)
        if: failure()
        run: |
          echo "::notice::Re-running only the tests added by our own changes"
          flutter test test/core/services/platform_capabilities_test.dart test/core/services/pro_entitlement_service_test.dart

  analyze:
    name: Analyze (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        continue-on-error: true
        run: |
          find lib test -name "*.dart" -not -name "*.g.dart" -not -name "*.gen.dart" \
            -not -path "*/firebase_options/*" \
            | xargs dart format --output=none --set-exit-if-changed --line-length=120

      - name: flutter analyze
        run: flutter analyze

  build-linux:
    name: Build Linux desktop
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        # Each of these was a real CMake failure during the first manual Linux
        # build (see ai/ENVIRONMENT.md §2.2). Keep the list in sync with
        # bin/setup_linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libpulse-dev \
            liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build (debug)
        # The community flavor is the only one that builds without private keys:
        # it has public Firebase config and empty dart-defines make RevenueCat,
        # Maps and Google Sign-In no-op instead of failing.
        run: flutter build linux --debug --target=lib/main_community.dart

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: storypad-linux-debug
          path: build/linux/x64/debug/bundle/
          retention-days: 7
          if-no-files-found: warn
